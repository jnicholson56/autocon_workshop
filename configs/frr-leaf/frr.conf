frr version 10.7.1_git
frr defaults datacenter
hostname frr-leaf
log stdout
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
vrf mgmt
exit-vrf
!
interface eth1
 description frr-leaf -> frr-spine [external]
 ip address 10.1.0.5/30
exit
!
interface eth2
 description frr-leaf -> client-2 [stub]
 ip address 172.16.1.3/24
exit
!
interface lo
 ip address 10.0.0.3/32
exit
!
router bgp 65002
 bgp router-id 10.0.0.3
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.1.0.6 remote-as 65000
 neighbor 10.1.0.6 description frr-spine
 use-underlays-nexthop-weight
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  network 172.16.1.0/24
  neighbor 10.1.0.6 activate
  no neighbor 10.1.0.6 send-community extended
 exit-address-family
exit
!
end
