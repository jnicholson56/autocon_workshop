site_name: Ansible Network Automation Workshop
site_description: 4-Hour Hands-on Multi-NOS Lab with Containerlab, SuzieQ, and Prometheus
site_author: Workshop Organizer
site_url: https://jnicholson56.github.io/autocon_workshop/
repo_url: https://github.com/jnicholson56/autocon_workshop
repo_name: jnicholson56/autocon_workshop

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

nav:
  - Overview & Topology: index.md
  - "Module 1: Foundations & Inventory": module-1.md
  - "Module 2: Declarative BGP & Jinja2": module-2.md
  - "Module 3: SuzieQ State Verification": module-3.md
  - "Module 4: Observability & Telemetry": module-4.md
