name: ansible-workshop-beginner

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    r1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux

    r2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux

    server1:
      kind: linux
      image: python:3.13-alpine

  links:
    - endpoints: ["r1:e1-1", "r2:e1-1"]
    - endpoints: ["r1:e1-2", "server1:eth1"]
    - endpoints: ["r2:e1-2", "server1:eth2"]
