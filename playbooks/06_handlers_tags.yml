# Module 4: Handlers & Tags Exercise
#
# Run this after reading module-4.md to practice handlers and tags.

- name: Deploy web server with handlers and tags
  hosts: servers
  gather_facts: false

  tasks:
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present
      tags: [install, packages]

    - name: Create document root
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: "0755"
      tags: [deploy]

    - name: Deploy index page
      ansible.builtin.template:
        src: lab_index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"
      notify: Restart nginx
      tags: [deploy]

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [deploy, service]

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
