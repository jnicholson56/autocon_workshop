# Send traffic from client-1 to client-2 across the fabric and confirm in Prometheus that
# srl-01 is forwarding it. The data comes from gnmic (gNMI streaming), not from the router CLI.
#
#   ansible-playbook playbooks/traffic_and_verify.yml
#   ansible-playbook playbooks/traffic_and_verify.yml -e rate=50M -e duration=90

- name: Start the iperf3 server on client-2
  hosts: client-2
  gather_facts: false
  tasks:
    - name: Run iperf3 as a daemon that exits after one test
      ansible.builtin.command: iperf3 --server --daemon --one-off
      changed_when: true

- name: Send traffic from client-1
  hosts: client-1
  gather_facts: false
  vars:
    rate: 20M
    duration: 45
    server: "{{ hostvars['client-2'].client_ip | default('172.16.1.5') }}"
  tasks:
    - name: Start a UDP flow in the background
      ansible.builtin.command: iperf3 --client {{ server }} --udp --bitrate {{ rate }} --time {{ duration }}
      async: "{{ duration | int + 30 }}"
      poll: 0
      register: iperf_job
      changed_when: true

- name: Check the traffic in Prometheus
  hosts: localhost
  gather_facts: false
  vars:
    prometheus_url: http://127.0.0.1:9091/api/v1
    # srl-01 receives the flow from client-1 on ethernet-1/2 and sends it to frr-spine on ethernet-1/1
    rate_query: rate(srl_interface_out_octets{router="srl-01",interface_name="ethernet-1/1"}[30s]) * 8
    min_bps: 5000000
  tasks:
    - name: Ask Prometheus for the transmit rate of ethernet-1/1 (it refreshes every 10 seconds)
      ansible.builtin.uri:
        url: "{{ prometheus_url }}/query?query={{ rate_query | urlencode }}"
        return_content: true
      register: prometheus
      until: >-
        prometheus.json.data.result | length > 0 and
        prometheus.json.data.result[0].value[1] | float > min_bps | int
      retries: 8
      delay: 10
      failed_when: false

    - name: The rate is above the threshold
      vars:
        bps: "{{ prometheus.json.data.result[0].value[1] | float if prometheus.json.data.result | length > 0 else 0 }}"
      ansible.builtin.assert:
        that: bps | float > min_bps | int
        success_msg: "srl-01 ethernet-1/1 is forwarding {{ (bps | float / 1000000) | round(1) }} Mbps"
        fail_msg: "srl-01 ethernet-1/1 is only forwarding {{ (bps | float / 1000000) | round(1) }} Mbps (expected more than {{ (min_bps | int / 1000000) | round(1) }})"

- name: Collect the iperf3 result
  hosts: client-1
  gather_facts: false
  vars:
    duration: 45
  tasks:
    - name: Wait for the flow to finish
      ansible.builtin.async_status:
        jid: "{{ iperf_job.ansible_job_id }}"
      register: iperf_result
      until: iperf_result.finished | bool
      retries: "{{ (duration | int / 5) | int + 12 }}"
      delay: 5

    - name: Show the receiver summary
      ansible.builtin.debug:
        msg: "{{ iperf_result.stdout_lines | select('search', 'receiver') | list }}"
