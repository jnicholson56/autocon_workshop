# Check every BGP session from the design in host_vars/ and that every router learned
# every service loopback. Each platform is queried in its own way, which is the point of Module 3.
#
#   ansible-playbook playbooks/verify_bgp.yml

- name: Verify BGP on every router
  hosts: routers
  gather_facts: false
  vars:
    service_prefixes: "{{ groups['routers'] | map('extract', hostvars, ['bgp', 'service_loopback']) | list }}"
  tasks:
    - name: Check FRR
      when: "'frr' in group_names"
      block:
        - name: Read the BGP summary (JSON)
          ansible.builtin.command: vtysh -c 'show bgp summary json'
          register: frr_summary
          changed_when: false

        - name: Read the BGP table (JSON)
          ansible.builtin.command: vtysh -c 'show bgp ipv4 unicast json'
          register: frr_table
          changed_when: false

        - name: Every configured neighbor is Established
          ansible.builtin.assert:
            that: (frr_summary.stdout | from_json).ipv4Unicast.peers[item.address].state == 'Established'
            success_msg: "{{ inventory_hostname }} -> {{ item.description }} ({{ item.address }}) is Established"
            fail_msg: "{{ inventory_hostname }} -> {{ item.description }} ({{ item.address }}) is not Established"
          loop: "{{ bgp.neighbors }}"
          loop_control:
            label: "{{ item.address }}"

        - name: Every service loopback is in the BGP table
          ansible.builtin.assert:
            that: item in (frr_table.stdout | from_json).routes
            success_msg: "{{ inventory_hostname }} has {{ item }}"
            fail_msg: "{{ inventory_hostname }} is missing {{ item }}"
          loop: "{{ service_prefixes }}"

    - name: Check SR Linux
      when: "'srl' in group_names"
      block:
        - name: Read the session state of each neighbor (structured data)
          nokia.srlinux.get:
            paths:
              - path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address={{ item.address }}]/session-state"
          register: srl_sessions
          loop: "{{ bgp.neighbors }}"
          loop_control:
            label: "{{ item.address }}"

        - name: Every configured neighbor is established
          ansible.builtin.assert:
            that: item.result[0] == 'established'
            success_msg: "{{ inventory_hostname }} -> {{ item.item.description }} ({{ item.item.address }}) is established"
            fail_msg: "{{ inventory_hostname }} -> {{ item.item.description }} ({{ item.item.address }}) is {{ item.result[0] }}"
          loop: "{{ srl_sessions.results }}"
          loop_control:
            label: "{{ item.item.address }}"

        - name: Look up each service loopback in the route table
          nokia.srlinux.get:
            paths:
              - path: "/network-instance[name=default]/route-table/ipv4-unicast/route[ipv4-prefix={{ item }}]/route-type"
          register: srl_routes
          loop: "{{ service_prefixes }}"

        - name: Every service loopback is in the route table
          ansible.builtin.assert:
            that: item.result[0].route | default([]) | length > 0
            success_msg: "{{ inventory_hostname }} has {{ item.item }}"
            fail_msg: "{{ inventory_hostname }} is missing {{ item.item }}"
          loop: "{{ srl_routes.results }}"
          loop_control:
            label: "{{ item.item }}"
