# Lab: Deploy a Web Stack
#
# Run this after reading module-4.md to complete the hands-on lab.

- name: Deploy a web server
  hosts: servers
  gather_facts: true

  vars:
    page_title: "Ansible Workshop - {{ ansible_hostname }}"
    document_root: /var/www/html

  tasks:
    # --- Install phase ---
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present
      tags: [install]

    # --- Deploy phase ---
    - name: Create document root
      ansible.builtin.file:
        path: "{{ document_root }}"
        state: directory
        mode: "0755"
      tags: [deploy]

    - name: Deploy index page
      ansible.builtin.template:
        src: lab_index.html.j2
        dest: "{{ document_root }}/index.html"
        mode: "0644"
      notify: Restart nginx
      tags: [deploy]

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [deploy, service]

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
