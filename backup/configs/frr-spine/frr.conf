frr version 10.7.1_git
frr defaults datacenter
hostname frr-spine
log stdout
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
vrf mgmt
exit-vrf
!
interface eth1
 description frr-spine -> srl-01 [external]
 ip address 10.1.0.1/30
exit
!
interface eth2
 description frr-spine -> frr-leaf [external]
 ip address 10.1.0.6/30
exit
!
interface lo
 ip address 10.0.0.2/32
exit
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.1.0.2 remote-as 65001
 neighbor 10.1.0.2 description srl-01
 neighbor 10.1.0.5 remote-as 65002
 neighbor 10.1.0.5 description frr-leaf
 use-underlays-nexthop-weight
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor 10.1.0.2 activate
  no neighbor 10.1.0.2 send-community extended
  neighbor 10.1.0.5 activate
  no neighbor 10.1.0.5 send-community extended
 exit-address-family
exit
!
end
