# Check the network through SuzieQ instead of logging in to each router.
#
#   ansible-playbook playbooks/validate_network.yml
#
# SuzieQ polls all three routers every 15 seconds: the FRR routers and srl-01 (the image adds
# SR Linux support, see configs/suzieq/srlinux/).

- name: Validate the fabric with SuzieQ
  hosts: localhost
  gather_facts: false
  vars:
    suzieq_url: http://127.0.0.1:8000/api/v2
    suzieq_headers:
      access_token: 496157e6e869ef7f3d6ecb24a6f6d847b224ee4f   # lab API key, see configs/suzieq/suzieq-cfg.yml
    # One session per neighbor entry on every router, taken from host_vars/
    expected_sessions: "{{ groups['routers'] | map('extract', hostvars, ['bgp', 'neighbors']) | map('length') | sum }}"
    service_prefixes: "{{ groups['routers'] | map('extract', hostvars, ['bgp', 'service_loopback']) | list }}"
  tasks:
    - name: Ask SuzieQ which routers it polls
      ansible.builtin.uri:
        url: "{{ suzieq_url }}/device/show?view=latest"
        headers: "{{ suzieq_headers }}"
        return_content: true
      register: sq_devices

    - name: Every router is polled and alive
      ansible.builtin.assert:
        that: >-
          sq_devices.json | selectattr('hostname', 'equalto', item)
          | selectattr('status', 'equalto', 'alive') | list | length == 1
        fail_msg: "SuzieQ is not polling {{ item }}"
        success_msg: "SuzieQ polls {{ item }}"
      loop: "{{ groups['routers'] }}"

    - name: Ask SuzieQ for every BGP session
      ansible.builtin.uri:
        url: "{{ suzieq_url }}/bgp/show?view=latest"
        headers: "{{ suzieq_headers }}"
        return_content: true
      register: sq_bgp

    - name: The expected number of sessions is known to SuzieQ
      ansible.builtin.assert:
        that: sq_bgp.json | length == expected_sessions | int
        fail_msg: "SuzieQ sees {{ sq_bgp.json | length }} sessions, the design has {{ expected_sessions }}"
        success_msg: "SuzieQ sees all {{ expected_sessions }} sessions"

    - name: Every session is Established
      ansible.builtin.assert:
        that: item.state == 'Established'
        fail_msg: "{{ item.hostname }} -> {{ item.peer }} is {{ item.state }} ({{ item.reason | default('no reason given') }})"
        success_msg: "{{ item.hostname }} -> {{ item.peer }} (AS{{ item.peerAsn }}) is Established"
      loop: "{{ sq_bgp.json }}"
      loop_control:
        label: "{{ item.hostname }} -> {{ item.peer }}"

    - name: Ask SuzieQ for every route learned through BGP
      ansible.builtin.uri:
        url: "{{ suzieq_url }}/route/show?protocol=bgp&view=latest"
        headers: "{{ suzieq_headers }}"
        return_content: true
      register: sq_routes

    - name: Every router learned every other router's service loopback through BGP
      vars:
        learned: "{{ sq_routes.json | selectattr('hostname', 'equalto', item.0) | map(attribute='prefix') | list }}"
      ansible.builtin.assert:
        that: item.1 in learned
        fail_msg: "{{ item.0 }} has no BGP route to {{ item.1 }}"
        success_msg: "{{ item.0 }} learned {{ item.1 }} through BGP"
      loop: "{{ groups['routers'] | product(service_prefixes) | list }}"
      loop_control:
        label: "{{ item.0 }} <- {{ item.1 }}"
      when: hostvars[item.0].bgp.service_loopback != item.1

    - name: Ask SuzieQ for its own BGP assertion
      ansible.builtin.uri:
        url: "{{ suzieq_url }}/bgp/assert?format=json"
        headers: "{{ suzieq_headers }}"
        return_content: true
      register: sq_assert

    - name: SuzieQ's BGP assertion passes everywhere
      ansible.builtin.assert:
        that: item.result == 'pass'
        fail_msg: "{{ item.hostname }} -> {{ item.peer }} failed: {{ item.assertReason }}"
        success_msg: "{{ item.hostname }} -> {{ item.peer }} passes"
      loop: "{{ sq_assert.json }}"
      loop_control:
        label: "{{ item.hostname }} -> {{ item.peer }}"
