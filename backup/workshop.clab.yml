# Generated by author/export.py from author/topology.yml (netlab). Do not edit by hand.
name: ansible-workshop
prefix: clab
mgmt:
  network: netlab_mgmt
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:df:1ab::/64
topology:
  nodes:
    srl-01:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      mgmt-ipv4: 172.20.20.11
      type: ixr-d2
      ports:
      - 127.0.0.1:2211:22
      - 127.0.0.1:8443:443
      startup-config: configs/srl-01/config.json
    frr-spine:
      kind: linux
      image: localhost/frr-mon:10.7.1
      mgmt-ipv4: 172.20.20.12
      binds:
      - configs/frr-spine/frr.conf:/etc/frr/frr.conf
      - configs/frr-spine/daemons:/etc/frr/daemons
      - configs/hosts:/etc/hosts:ro
      - configs/ssh/lab_key.pub:/home/admin/.ssh/authorized_keys:ro
      ports:
      - 127.0.0.1:2212:22
    frr-leaf:
      kind: linux
      image: localhost/frr-mon:10.7.1
      mgmt-ipv4: 172.20.20.13
      binds:
      - configs/frr-leaf/frr.conf:/etc/frr/frr.conf
      - configs/frr-leaf/daemons:/etc/frr/daemons
      - configs/hosts:/etc/hosts:ro
      - configs/ssh/lab_key.pub:/home/admin/.ssh/authorized_keys:ro
      ports:
      - 127.0.0.1:2213:22
    client-1:
      kind: linux
      image: python:3.13-alpine
      mgmt-ipv4: 172.20.20.21
      binds:
      - configs/hosts:/etc/hosts:ro
      - configs/client-1/setup.sh:/setup.sh
      exec:
      - sh /setup.sh
      - apk add --no-cache iperf3
      dns:
        servers:
        - 1.1.1.1
        - 8.8.8.8
      restart-policy: 'no'
    client-2:
      kind: linux
      image: python:3.13-alpine
      mgmt-ipv4: 172.20.20.22
      binds:
      - configs/hosts:/etc/hosts:ro
      - configs/client-2/setup.sh:/setup.sh
      exec:
      - sh /setup.sh
      - apk add --no-cache iperf3
      dns:
        servers:
        - 1.1.1.1
        - 8.8.8.8
      restart-policy: 'no'
    suzieq:
      kind: linux
      image: localhost/suzieq:local
      mgmt-ipv4: 172.20.20.30
      binds:
      - configs/suzieq/inventory.yml:/home/suzieq/inventory.yml
      - configs/hosts:/etc/hosts:ro
      cmd: -c "sq-poller -I /home/suzieq/inventory.yml >/tmp/poller.log 2>&1 & sq-rest-server
        >/tmp/rest.log 2>&1 & exec suzieq-gui"
      ports:
      - 8501:8501
      - 127.0.0.1:8000:8000
      restart-policy: 'no'
    grafana:
      kind: linux
      image: grafana/grafana:13.3.1
      mgmt-ipv4: 172.20.20.31
      binds:
      - configs/grafana/provisioning:/etc/grafana/provisioning
      - configs/grafana/dashboards:/var/lib/grafana-dashboards
      - configs/grafana/data:/var/lib/grafana
      - configs/hosts:/etc/hosts:ro
      ports:
      - 3000:3000
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: workshop
        GF_AUTH_ANONYMOUS_ENABLED: 'true'
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
        GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/workshop.json
      restart-policy: 'no'
    prometheus:
      kind: linux
      image: quay.io/prometheus/prometheus:v3.16.0
      mgmt-ipv4: 172.20.20.32
      binds:
      - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - configs/prometheus/rules.yml:/etc/prometheus/rules.yml
      - configs/hosts:/etc/hosts:ro
      ports:
      - 9091:9090
      restart-policy: 'no'
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.49.1
      mgmt-ipv4: 172.20.20.33
      binds:
      - configs/gnmic/gnmic.yml:/app/gnmic.yml
      - configs/hosts:/etc/hosts:ro
      cmd: --config /app/gnmic.yml subscribe
      restart-policy: 'no'
  links:
  - endpoints:
    - srl-01:e1-1
    - frr-spine:eth1
  - endpoints:
    - frr-spine:eth2
    - frr-leaf:eth1
  - endpoints:
    - srl-01:e1-2
    - client-1:eth1
  - endpoints:
    - frr-leaf:eth2
    - client-2:eth1
